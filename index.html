<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isidaurum | Official Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            /* Palette Torèt, Panna e Beige */
            --toret-green: #154734; 
            --toret-light: #226b4f;
            --panna: #FDFBF7;
            --beige: #EBE3D5;
            --text-dark: #1A2520; 
            --text-muted: #5A6960;
        }

        body {
            font-family: 'Urbanist', sans-serif;
            background-color: var(--panna);
            color: var(--text-dark);
            margin: 0;
            scroll-behavior: smooth;
        }

        /* --- MENU HAMBURGER FLUTTUANTE --- */
        .hamburger-wrapper {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 9999;
        }
        .hamburger-btn {
            background-color: var(--beige);
            color: var(--toret-green);
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            font-size: 1.6rem;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
        }
        .hamburger-btn:hover {
            transform: scale(1.1);
            background-color: var(--toret-green);
            color: var(--panna);
        }
        .menu-dropdown {
            position: absolute;
            top: 70px;
            right: 0;
            background-color: var(--panna);
            border: 2px solid var(--beige);
            border-radius: 20px;
            padding: 15px 0;
            width: 220px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }
        .menu-dropdown.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .menu-dropdown a {
            display: block;
            padding: 12px 25px;
            color: var(--toret-green);
            text-decoration: none;
            font-weight: 800;
            font-size: 1.1rem;
            transition: 0.2s;
        }
        .menu-dropdown a:hover {
            background-color: var(--beige);
            padding-left: 30px;
        }

        /* --- SEZIONE HERO CON STRATI MULTIPLI --- */
        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('./sfondo.svg'), linear-gradient(135deg, var(--toret-green), #0a291d);
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            color: var(--panna);
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10; 
        }

        .profile-container {
            position: relative;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid var(--beige);
            padding: 5px;
            object-fit: cover;
            background: var(--panna);
        }

        .hero h1 { font-size: 4rem; margin: 0; font-weight: 800; letter-spacing: -2px; text-shadow: 2px 2px 16px #000000; }
        .hero p { font-size: 1.5rem; color: var(--beige); margin: 10px 0; text-shadow: 2px 2px 8px #000000; }

        /* --- STRUTTURA DELLE SEZIONI --- */
        .section { padding: 80px 20px; max-width: 1000px; margin: 0 auto; }
        .section-title { font-size: 2.5rem; text-align: center; margin-bottom: 30px; color: var(--toret-green); }
        .section-subtitle { text-align: center; color: var(--text-muted); margin-top: -20px; margin-bottom: 40px; font-weight: 600; }

        /* --- INTERRUTTORE 30/90 GIORNI --- */
        .toggle-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .toggle-btn {
            background: transparent;
            color: var(--toret-green);
            border: 2px solid var(--toret-green);
            padding: 10px 25px;
            border-radius: 30px;
            font-family: 'Urbanist', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-btn.active, .toggle-btn:hover {
            background: var(--toret-green);
            color: var(--panna);
        }

        /* --- SEZIONE METRICHE E CARDS --- */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: var(--beige);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: 0.3s;
            border: 2px solid transparent;
        }

        .stat-card:hover { border-color: var(--toret-green); transform: translateY(-10px); }
        .stat-card i { font-size: 2rem; color: var(--toret-green); margin-bottom: 15px; }
        .stat-num { font-size: 3rem; font-weight: 800; display: block; color: var(--toret-green); transition: 0.3s; }
        .stat-label { color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; font-size: 0.9rem;}

        .content-card {
            background: var(--panna);
            border: 2px solid var(--beige);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .content-card:hover { border-color: var(--toret-light); transform: translateY(-5px); }
        .content-card i { font-size: 2.5rem; color: var(--toret-light); margin-bottom: 15px; }
        .content-card h4 { margin: 0 0 10px 0; color: var(--text-dark); font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }
        .content-num { font-size: 2.2rem; font-weight: 800; color: var(--toret-green); }

        /* --- AUDIENCE LISTS E BARRE --- */
        .progress-bar-bg {
            width: 100%;
            background: #d5cfc4;
            height: 12px;
            border-radius: 6px;
            margin-top: 15px;
            display: flex;
            overflow: hidden;
        }
        .progress-fill-m { background: var(--toret-green); height: 100%; }
        .progress-fill-f { background: var(--toret-light); height: 100%; }
        
        .audience-list { list-style: none; padding: 0; text-align: left; margin: 15px auto 0 auto; max-width: 200px; color: var(--toret-green); font-weight: 700; font-size: 1.1rem; }
        .audience-list li { margin-bottom: 12px; border-bottom: 1px solid rgba(21, 71, 52, 0.1); padding-bottom: 5px; }
        .audience-list li:last-child { border-bottom: none; }
        .audience-sub { color: var(--text-muted); font-size: 0.9rem; font-weight: 700; margin-top: 15px; margin-bottom: 5px; text-align: left; max-width: 200px; margin-left: auto; margin-right: auto; }

        /* --- CALCOLATORE ENGAGEMENT --- */
        .engagement-box {
            background: var(--beige);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .select-style {
            background-color: var(--panna);
            color: var(--toret-green);
            border: 2px solid var(--toret-green);
            padding: 12px 20px;
            font-size: 1.1rem;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            font-family: 'Urbanist', sans-serif;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: 0.3s;
            margin-bottom: 30px;
        }

        .select-style:focus { background-color: var(--toret-green); color: var(--panna); }

        .result-box { display: none; animation: fadeIn 0.5s ease; }
        .er-display { font-size: 5rem; font-weight: 800; color: var(--toret-green); margin: 10px 0; }

        /* --- SEZIONE COLLABORAZIONI --- */
        .year-title {
            color: var(--toret-green);
            font-size: 1.8rem;
            margin-top: 40px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--beige);
            padding-bottom: 10px;
            text-align: left;
        }

        .collab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .collab-card {
            background: var(--beige);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1px solid rgba(21, 71, 52, 0.1);
            transition: 0.3s;
        }

        .collab-card:hover { border-color: var(--toret-green); transform: translateY(-5px); }
        .collab-brand { color: var(--text-dark); font-weight: 800; font-size: 1.1rem; margin-bottom: 5px; }
        .collab-date { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;}

        /* --- LINK AI REEL NELLE COLLAB --- */
        .collab-link {
            margin-top: 12px;
            display: inline-block;
            color: var(--toret-light);
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 1px;
            transition: 0.3s;
            border-top: 1px solid rgba(21, 71, 52, 0.1);
            padding-top: 8px;
            width: 100%;
        }
        .collab-link i { margin-left: 5px; }
        .collab-link:hover { color: var(--toret-green); }
        .collab-card:hover .collab-link { border-top-color: var(--toret-green); }

        .scroll-down { position: absolute; bottom: 30px; animation: bounce 2s infinite; color: var(--beige); z-index: 1; cursor:pointer; }

        /* --- SEZIONE CONTATTI (MAIL) --- */
        .contact-section {
            background-color: var(--toret-green);
            color: var(--panna);
            text-align: center;
            padding: 120px 20px;
            border-radius: 60px 60px 0 0;
            margin-top: 50px;
        }
        .mail-icon-wrap {
            font-size: 7rem;
            margin-bottom: 30px;
            display: inline-block;
            animation: pulse-mail 3s infinite ease-in-out;
            color: var(--panna);
        }
        .contact-title { font-size: 3.5rem; font-weight: 800; margin-bottom: 10px; }
        .contact-btn {
            display: inline-block;
            margin-top: 40px;
            padding: 20px 50px;
            background-color: var(--panna);
            color: var(--toret-green);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.2rem;
            transition: 0.3s;
        }
        .contact-btn:hover { transform: scale(1.05); background-color: var(--beige); }

        /* --- STILE ICONE SOCIAL FOOTER --- */
        .social-footer {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        .social-footer a {
            color: var(--beige);
            font-size: 2.5rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .social-footer a:hover {
            color: var(--panna);
            transform: translateY(-5px); 
        }

        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse-mail {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

    <script>
        // Funzione Menu a tendina
        function toggleMenu() {
            document.getElementById('dropdownMenu').classList.toggle('active');
        }

        function toggleTimeframe(period) {
            document.getElementById('btn-30').classList.remove('active');
            document.getElementById('btn-90').classList.remove('active');
            document.getElementById('btn-' + period).classList.add('active');

            if (period === '30') {
                document.getElementById('ig-reach').innerText = '564K';
                document.getElementById('ig-views').innerText = '1.94M';
                document.getElementById('ig-nonfollowers').innerText = '57.5%';
            } else {
                document.getElementById('ig-reach').innerText = '1.46M';
                document.getElementById('ig-views').innerText = '5.89M';
                document.getElementById('ig-nonfollowers').innerText = '54.5%';
            }
        }

        function showER() {
            const platform = document.getElementById('platform-select').value;
            const container = document.getElementById('result-container');
            const erValue = document.getElementById('er-value');

            if (platform === 'instagram') {
                erValue.innerText = '5.32%'; 
                container.style.display = 'block';
            } else if (platform === 'tiktok') {
                erValue.innerText = '6.85%'; 
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
            }
        }
    </script>
