<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Kit - Isidoro (@isidaurum)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Qui inizia il CSS: i nostri "colori e arredamento" */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212; /* Sfondo scuro elegante per tutto il sito */
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            padding: 50px 20px 40px 20px;
            /* Una sfumatura accattivante che va dal rosso TikTok all'azzurro */
            background: linear-gradient(135deg, #ff0050, #00f2fe); 
            width: 100%;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .profile-pic {
            width: 160px;
            height: 160px;
            border-radius: 50%; /* Rende l'immagine un cerchio perfetto */
            border: 5px solid #ffffff; /* Bordo bianco intorno alla foto */
            background-color: #cccccc; /* Colore grigio temporaneo */
            margin-bottom: 15px;
            object-fit: cover;
        }

        h1 {
            margin: 0;
            font-size: 2.8rem;
            letter-spacing: 1px;
        }

        p.bio {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://via.placeholder.com/160" alt="Foto Profilo di Isidoro" class="profile-pic">
        
        <h1>Isidoro</h1>
        <p class="bio">@isidaurum | Creator & Influencer</p>
    </div>

</body>
</html>
