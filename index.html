<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isidaurum | Official Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            /* La nostra nuova palette Torèt, Panna e Beige */
            --toret-green: #154734; 
            --toret-light: #226b4f;
            --panna: #FDFBF7;
            --beige: #EBE3D5;
            --text-dark: #1A2520; /* Un verde quasi nero per i testi */
            --text-muted: #5A6960; /* Un verde grigiastro per i testi secondari */
        }

        body {
            font-family: 'Urbanist', sans-serif;
            background-color: var(--panna);
            color: var(--text-dark);
            margin: 0;
            scroll-behavior: smooth;
        }

        /* --- SEZIONE HERO (COPERTINA VERDE TORET) --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--toret-green), #0a291d);
            color: var(--panna);
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .profile-container {
            position: relative;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid var(--beige);
            padding: 5px;
            object-fit: cover;
            background: var(--panna);
        }

        .hero h1 { font-size: 4rem; margin: 0; font-weight: 800; letter-spacing: -2px; }
