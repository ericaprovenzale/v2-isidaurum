<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isidaurum | Official Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            /* Palette Torèt, Panna e Beige */
            --toret-green: #154734; 
            --toret-light: #226b4f;
            --panna: #FDFBF7;
            --beige: #EBE3D5;
            --text-dark: #1A2520; 
            --text-muted: #5A6960;
        }

        body {
            font-family: 'Urbanist', sans-serif;
            background-color: var(--panna);
            color: var(--text-dark);
            margin: 0;
            scroll-behavior: smooth;
        }

        /* --- SEZIONE HERO (COPERTINA VERDE TORET) --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--toret-green), #0a291d);
            color: var(--panna);
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .profile-container {
            position: relative;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid var(--beige);
            padding: 5px;
            object-fit: cover;
            background: var(--panna);
        }

        .hero h1 { font-size: 4rem; margin: 0; font-weight: 800; letter-spacing: -2px; }
        .hero p { font-size: 1.5rem; color: var(--beige); margin: 10px 0; }

        /* --- STRUTTURA DELLE SEZIONI --- */
        .section { padding: 80px 20px; max-width: 1000px; margin: 0 auto; }
        .section-title { font-size: 2.5rem; text-align: center; margin-bottom: 40px; color: var(--toret-green); }

        /* --- SEZIONE METRICHE --- */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: var(--beige);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: 0.3s;
            border: 2px solid transparent;
        }

        .stat-card:hover { border-color: var(--toret-green); transform: translateY(-10px); }
        .stat-card i { font-size: 2rem; color: var(--toret-green); margin-bottom: 15px; }
        .stat-num { font-size: 3rem; font-weight: 800; display: block; color: var(--toret-green); }
        .stat-label { color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }

        /* --- CALCOLATORE ENGAGEMENT --- */
